<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Luxtronic Service</title>
<link rel="icon" type="image/png" href="/images/logo.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="header">
  <div class="logo-container">
    <img src="/images/logo.png" alt="Luxtronic" class="logo-img">
    <a href="/" class="brand-name">LUXTRONIC</a>
    <span class="tagline">Service Form</span>
  </div>
  <div class="dark-mode-toggle" id="darkModeToggle"><i class="fas fa-moon" id="themeIcon"></i></div>
</header>
<nav class="nav-bar">
  <a href="/" class="nav-item"><i class="fas fa-gauge-high"></i><span class="nav-text">Dashboard</span></a>
  <a href="/records" class="nav-item"><i class="fas fa-folder"></i><span class="nav-text">Records</span></a>
  <a href="/analytics" class="nav-item"><i class="fas fa-chart-column"></i><span class="nav-text">Analytics</span></a>
  <a href="/service-form" class="nav-item nav-item-accent"><i class="fas fa-plus"></i><span class="nav-text">New Service</span></a>
</nav>
<main>
  <h1>Dashboard</h1>
  <p class="subtitle">Jobs currently in progress, and anything you left mid-way through.</p>

  <div class="stats-grid" id="statsGrid"></div>

  <div id="draftsSection" class="panel" style="display:none;">
    <h2>Unfinished Drafts <span style="font-weight:normal; color:var(--muted); font-size:13px;">- resume where you left off</span></h2>
    <table>
      <thead><tr><th>Form ID</th><th>Customer</th><th>Device</th><th></th></tr></thead>
      <tbody id="draftsBody"></tbody>
    </table>
  </div>

  <div class="panel">
    <h2>In Progress<span id="inProgressCount" style="color:var(--muted); font-weight:normal;"></span></h2>
    <table>
      <thead><tr><th>Form ID</th><th>Customer</th><th>Device</th><th>Total</th><th>Date</th><th></th></tr></thead>
      <tbody id="inProgressBody"></tbody>
    </table>
    <div id="inProgressEmpty" class="empty" style="display:none;">Nothing in progress right now.</div>
  </div>
</main>
<script src="/js/common.js"></script>
<script src="/js/dashboard.js"></script>
</body>
</html>
